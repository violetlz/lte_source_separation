[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lte-source-separation"
version = "0.1.0"
description = "Reproducible LTE-inspired asynchronous OFDM waveform benchmark"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.23,<3",
  "PyYAML>=6,<7",
  "matplotlib>=3.6,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "scipy>=1.10,<2"]
train = ["torch>=2.7,<3", "wandb>=0.19,<1"]

[project.scripts]
rfsep = "rfsep.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
